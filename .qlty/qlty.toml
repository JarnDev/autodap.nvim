# Qlty configuration, used by both the Qlty CLI and Qlty Cloud.
#
# The plugin list below is what `qlty init` detects for this repository; it is
# committed so the CLI and the PR check agree on what runs. Reference:
# https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

# The projects under tests/fixtures/ are debuggee material, not code we ship.
# Their asserts, constant conditions, and odd one-line bodies are the input the
# plugin is tested against — a linter reporting them is reporting the fixture's
# purpose as a defect. Python linters are therefore scoped out of that tree;
# everything else (including trufflehog secret scanning) still runs there, and
# these plugins still run normally everywhere else in the repo.
[[exclude]]
file_patterns = ["tests/fixtures/**"]
plugins = ["bandit", "radarlint-python", "ruff"]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
