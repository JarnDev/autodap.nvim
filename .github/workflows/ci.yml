name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only reads the checkout. Without this block the
# token would inherit the repository default, which can be write-all.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false keeps the job's token out of .git/config.
      # Nothing here talks to the remote: `make test` clones nvim-dap over
      # anonymous https and the rest is local.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Neovim (stable)
        run: |
          curl -fsSLO https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.appimage
          chmod +x nvim-linux-x86_64.appimage
          ./nvim-linux-x86_64.appimage --appimage-extract >/dev/null
          echo "$PWD/squashfs-root/usr/bin" >> "$GITHUB_PATH"

      - name: Version
        run: nvim --version | head -1

      # AUTODAP_REQUIRE_TREESITTER turns "no parser built, cases skipped" into a
      # failure. The runner has a C compiler, so a skip here means the parser
      # bootstrap broke, not that the environment is thin.
      - name: Run tests
        run: make test
        env:
          AUTODAP_REQUIRE_TREESITTER: '1'

  e2e:
    name: end-to-end (real debug session)
    runs-on: ubuntu-latest
    # Pinned here as well as in scripts/e2e.sh so the cache key below and the
    # download the script performs can never drift apart.
    env:
      CODELLDB_VERSION: v1.12.3
    steps:
      # persist-credentials: false keeps the job's token out of .git/config.
      # This job runs a real debug session against a throwaway config; nothing
      # in it talks to the remote with the workflow token.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Neovim (stable)
        run: |
          curl -fsSLO https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.appimage
          chmod +x nvim-linux-x86_64.appimage
          ./nvim-linux-x86_64.appimage --appimage-extract >/dev/null
          echo "$PWD/squashfs-root/usr/bin" >> "$GITHUB_PATH"

      # codelldb is a ~55MB release artifact; without this every run re-downloads
      # it. ubuntu-latest already ships g++, so the C/C++ half runs here.
      - name: Cache the codelldb download
        uses: actions/cache@v4
        with:
          path: ~/.cache/autodap-e2e
          key: codelldb-${{ runner.os }}-${{ env.CODELLDB_VERSION }}

      # Installs autodap into a throwaway Neovim config the way the README
      # documents, then debugs a sample project for real: breakpoint, locals,
      # run to completion. Covers Python, Node and C/C++.
      - name: Run the end-to-end debug session
        run: make test-e2e
