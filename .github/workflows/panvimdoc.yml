name: panvimdoc

# Verifies that the committed doc/autodap.txt matches README.md. It deliberately
# does NOT commit: a workflow cannot produce a GPG-signed commit without a private
# key in secrets, and an unsigned commit in the history is not wanted. Regenerate
# with `make docs` locally and commit it yourself -- the output is byte-identical
# to what this job generates.
on:
  push:
    branches: [main]
    paths: [README.md, doc/autodap.txt]
  pull_request:
    paths: [README.md, doc/autodap.txt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pandoc writes doc/autodap.txt but will not create the directory itself.
      - name: Ensure doc/ exists
        run: mkdir -p doc

      - name: Generate vimdoc from README
        uses: kdheepak/panvimdoc@main
        with:
          vimdoc: autodap
          version: "Neovim >= 0.10"
          demojify: true
          treesitter: true

      - name: Fail if the committed vimdoc is stale
        run: |
          if ! git diff --exit-code -- doc/; then
            echo "::error::doc/autodap.txt is out of date. Run 'make docs' and commit the result."
            exit 1
          fi
          echo "doc/autodap.txt is current."
