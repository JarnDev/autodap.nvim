name: panvimdoc

# Verifies that the committed doc/autodap.txt matches README.md. It deliberately
# does NOT commit: a workflow cannot produce a GPG-signed commit without a private
# key in secrets, and an unsigned commit in the history is not wanted. Regenerate
# with `make docs` locally and commit it yourself -- the output is byte-identical
# to what this job generates.
on:
  push:
    branches: [main]
    paths: [README.md, doc/autodap.txt, Makefile, .github/workflows/panvimdoc.yml]
  pull_request:
    paths: [README.md, doc/autodap.txt, Makefile, .github/workflows/panvimdoc.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Regenerate with the SAME generator the maintainer runs locally
      # (`make docs`: pinned pandoc image + pinned panvimdoc, and no date at all
      # -- a date would make this job compare the docs *and* a value each side
      # derives differently; see the `nodate` note in the Makefile),
      # rather than a separate action whose version/whitespace could drift out of
      # step with the committed file. Byte-identical by construction.
      - name: Regenerate vimdoc with make docs
        run: make docs

      - name: Fail if the committed vimdoc is stale
        run: |
          if ! git diff --exit-code -- doc/; then
            echo "::error::doc/autodap.txt is out of date. Run 'make docs' and commit the result."
            exit 1
          fi
          echo "doc/autodap.txt is current."
